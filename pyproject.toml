[project]
name = "smolpowers-tests"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "harbor==0.20.1.dev202607310211",
    "jinja2==3.1.6",
    "pyyaml==6.0.3",
    "pytest==8.4.1",
    "ruff==0.15.22",
    "tiktoken==0.13.0",
]

[tool.uv]
package = false

[tool.basedpyright]
include = ["harbor", "skills/smol-activate/scripts", "tests"]
exclude = ["**/.venv", "harbor/jobs", "harbor/tasks/*/environment"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = "-ra"
norecursedirs = [".venv", "fixtures", "jobs"]
pythonpath = ["harbor"]
python_files = ["test_*.py"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "basedpyright==1.39.9",
]
