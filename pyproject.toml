[project]
name = "smolpowers-tests"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "harbor==0.20.0",
    "jinja2==3.1.6",
    "pipx==1.16.1",
    "pyyaml==6.0.3",
    "pytest==8.4.1",
    "tiktoken==0.13.0",
]

[tool.uv]
package = false

[tool.basedpyright]
include = ["harbor", "skills/smol-activate/scripts", "tests"]
exclude = ["harbor/shared", "harbor/jobs"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = "-ra"
norecursedirs = [".venv", "fixtures", "jobs"]
pythonpath = ["harbor"]
python_files = ["test_*.py"]
testpaths = ["tests"]
