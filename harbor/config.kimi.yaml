jobs_dir: harbor/jobs
debug: true
n_concurrent_trials: 8

tasks:
  - path: harbor/tasks/verify-small-change
  - path: harbor/tasks/verify-activation

agents:
  - name: kimi-superpowers
    import_path: agents:KimiSuperpowers
    model_name: kimi/kimi-for-coding
    kwargs:
      lifecycle_instruction: "Follow the Superpowers lifecycle in order: `using-superpowers`, `brainstorming`, `writing-plans`, `test-driven-development`, `verification-before-completion`. Invoke each skill with the Skill tool."
      superpowers_ref: v6.2.0

  - name: kimi-smol
    import_path: agents:KimiSmol
    model_name: kimi/kimi-for-coding
    skills:
      - ./skills
    kwargs:
      lifecycle_instruction: Use the `smol-activate` skill.

  - name: kimi-mix
    import_path: agents:KimiMix
    model_name: kimi/kimi-for-coding
    skills:
      - ./skills
      - https://github.com/obra/superpowers/tree/v6.2.0/skills/writing-plans
      - https://github.com/obra/superpowers/tree/v6.2.0/skills/test-driven-development
    kwargs:
      lifecycle_instruction: "Follow the lifecycle in order: `smol-activate`, `smol-design`, `writing-plans`, `smol-execute`, `test-driven-development`, `smol-finish`. Invoke each skill with the Skill tool."
