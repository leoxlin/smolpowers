jobs_dir: harbor/jobs
debug: true
n_concurrent_trials: 8

tasks:
  - path: harbor/task

agents:
  - name: codex-sp
    import_path: agents:CodexSp
    model_name: openai/gpt-5.6-sol
    skills:
      - https://github.com/obra/superpowers/tree/v6.2.0/skills
    kwargs:
      reasoning_effort: medium
      reasoning_summary: detailed
      lifecycle_instruction: Use the `using-superpowers` skill.

  - name: codex-smol
    import_path: agents:CodexSmol
    model_name: openai/gpt-5.6-sol
    skills:
      - ./skills
    kwargs:
      reasoning_effort: medium
      reasoning_summary: detailed
      lifecycle_instruction: Use the `smol-activate` skill.

  - name: codex-mix
    import_path: agents:CodexMix
    model_name: openai/gpt-5.6-sol
    skills:
      - ./skills
      - https://github.com/obra/superpowers/tree/v6.2.0/skills/writing-plans
      - https://github.com/obra/superpowers/tree/v6.2.0/skills/test-driven-development
    kwargs:
      reasoning_effort: medium
      reasoning_summary: detailed
      lifecycle_instruction: Use the `smol-activate` skill.
