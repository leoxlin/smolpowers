schema_version = "1.3"

[metadata]
author_name = "Smolpowers"
difficulty = "hard"
category = "software-engineering"
tags = ["skills", "lifecycle", "superpowers"]

[agent]
timeout_sec = 1800
user = "agent"

[verifier]
timeout_sec = 120
user = "root"

[verifier.env]
EXPECTED_SKILLS = '["using-superpowers", "brainstorming", "writing-plans", "test-driven-development", "verification-before-completion"]'

[environment]
build_timeout_sec = 600
network_mode = "public"
