[project]
name = "smolpowers-tests"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "harbor==0.20.0",
    "pipx==1.16.1",
    "pytest==8.4.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
norecursedirs = [".venv", "harbor", "jobs"]
python_files = ["test_*.py"]
testpaths = ["."]
