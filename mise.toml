[tools]
node = "24"
python = "3.14"
uv = "latest"

[tasks."test:unit"]
description = "Run unit tests"
raw_args = true
run = "uv run --locked pytest -c pyproject.toml"

[tasks.lint]
description = "Lint Python files"
raw_args = true
run = "uv run --locked ruff check ."

[tasks."test:integration"]
description = "Run integration tests"
raw_args = true
run = """
ANTHROPIC_API_KEY="$OPENROUTER_API_KEY" \
ANTHROPIC_BASE_URL="https://openrouter.ai/api" \
CODEX_FORCE_AUTH_JSON=1 \
uv run --locked python harbor/run_harbor.py \
  --case override \
  --case superpowers \
  --agent claude-code=openrouter/moonshotai/kimi-k2.7-code \
  --agent codex=openai/gpt-5.6-sol \
  --agent kimi-cli=openrouter/moonshotai/kimi-k2.7-code \
  --agent pi=openrouter/moonshotai/kimi-k2.7-code
CODEX_FORCE_AUTH_JSON=1 \
uv run --locked python harbor/run_harbor.py \
  --case base \
  --agent codex=openai/gpt-5.6-sol
"""

[tasks."test:integration:codex"]
description = "Run the base lifecycle integration test in Codex"
raw_args = true
run = """
CODEX_FORCE_AUTH_JSON=1 \
uv run --locked python harbor/run_harbor.py \
  --case base \
  --case override \
  --case superpowers \
  --agent codex=openai/gpt-5.6-sol
"""

[tasks.dashboard]
description = "Serve the Harbor jobs dashboard (harbor/jobs) on http://127.0.0.1:8642/"
raw_args = true
run = "uv run --locked python harbor/harbor_dashboard.py"

[tasks.test]
description = "Run all tests"
depends = ["test:unit", "test:integration"]
