[tools]
node = "24"
python = "3.14"
uv = "latest"

[tasks."test:unit"]
description = "Run unit tests"
raw_args = true
run = "uv run --locked pytest -c pyproject.toml"

[tasks.lint]
description = "Lint and type-check Python files"
raw_args = true
run = """
uv run --locked ruff check .
uv run --locked basedpyright
"""

[tasks.tokens]
description = "Count skill tokens"
run = "uv run --locked python tools/token_counter.py"

[tasks."test:integration"]
description = "Run integration tests"
raw_args = true
run = """
PYTHONPATH=harbor \
CODEX_FORCE_AUTH_JSON=1 \
uv run --locked harbor jobs start --config harbor/config.codex.yaml
PYTHONPATH=harbor \
uv run --locked harbor jobs start --config harbor/config.kimi.yaml
"""

[tasks."test:integration:codex"]
description = "Run all lifecycle integration tests in Codex"
raw_args = true
run = """
PYTHONPATH=harbor \
CODEX_FORCE_AUTH_JSON=1 \
uv run --locked harbor jobs start --config harbor/config.codex.yaml
"""

[tasks."test:integration:kimi"]
description = "Run all lifecycle integration tests in Kimi CLI"
raw_args = true
run = """
PYTHONPATH=harbor \
uv run --locked harbor jobs start --config harbor/config.kimi.yaml
"""

[tasks.dashboard]
description = "Serve the Harbor jobs dashboard (harbor/jobs) on http://127.0.0.1:8642/"
raw_args = true
run = "uv run --locked python harbor/harbor_dashboard.py"

[tasks.clean]
description = "Clear generated artifacts, keeping harbor/jobs"
run = """
rm -rf .ruff_cache .venv tests/.venv
find . -type d \\( -name __pycache__ -o -name .pytest_cache \\) -exec rm -rf {} +
"""

[tasks.test]
description = "Run all tests"
depends = ["test:unit", "test:integration"]
