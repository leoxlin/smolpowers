[tools]
node = "24"
python = "3.14"
uv = "latest"

[tasks."test:unit"]
description = "Run unit tests"
raw_args = true
run = "uv run --locked pytest -c pyproject.toml"

[tasks.lint]
description = "Lint and type-check Python files"
raw_args = true
run = """
uv run --locked ruff check .
uv run --locked basedpyright
"""

[tasks.tokens]
description = "Count skill tokens"
run = "uv run --locked python tools/token_counter.py"

[tasks."test:integration"]
description = "Run integration tests"
raw_args = true
run = """
PYTHONPATH=harbor \
CODEX_FORCE_AUTH_JSON=1 \
uv run --locked harbor jobs start --config harbor/config.codex.yaml \
  --path harbor/tasks/verify-small-change
PYTHONPATH=harbor \
CODEX_FORCE_AUTH_JSON=1 \
uv run --locked harbor jobs start --config harbor/config.codex.yaml \
  --path harbor/tasks/verify-activation \
  --agent agents:CodexSmol \
  --model openai/gpt-5.6-sol \
  --skill ./skills \
  --ak reasoning_effort=medium \
  --ak reasoning_summary=detailed \
  --ak 'lifecycle_instruction=Use the `smol-activate` skill.'
PYTHONPATH=harbor \
uv run --locked harbor jobs start --config harbor/config.kimi.yaml \
  --path harbor/tasks/verify-small-change
PYTHONPATH=harbor \
uv run --locked harbor jobs start --config harbor/config.kimi.yaml \
  --path harbor/tasks/verify-activation \
  --agent agents:KimiSmol \
  --model kimi/kimi-for-coding \
  --skill ./skills \
  --ak 'lifecycle_instruction=Use the `smol-activate` skill.'
"""

[tasks."test:integration:codex"]
description = "Run all Codex integration tests"
raw_args = true
run = """
PYTHONPATH=harbor \
CODEX_FORCE_AUTH_JSON=1 \
uv run --locked harbor jobs start --config harbor/config.codex.yaml \
  --path harbor/tasks/verify-small-change
PYTHONPATH=harbor \
CODEX_FORCE_AUTH_JSON=1 \
uv run --locked harbor jobs start --config harbor/config.codex.yaml \
  --path harbor/tasks/verify-activation \
  --agent agents:CodexSmol \
  --model openai/gpt-5.6-sol \
  --skill ./skills \
  --ak reasoning_effort=medium \
  --ak reasoning_summary=detailed \
  --ak 'lifecycle_instruction=Use the `smol-activate` skill.'
"""

[tasks."test:integration:kimi"]
description = "Run all Kimi CLI integration tests"
raw_args = true
run = """
PYTHONPATH=harbor \
uv run --locked harbor jobs start --config harbor/config.kimi.yaml \
  --path harbor/tasks/verify-small-change
PYTHONPATH=harbor \
uv run --locked harbor jobs start --config harbor/config.kimi.yaml \
  --path harbor/tasks/verify-activation \
  --agent agents:KimiSmol \
  --model kimi/kimi-for-coding \
  --skill ./skills \
  --ak 'lifecycle_instruction=Use the `smol-activate` skill.'
"""

[tasks.dashboard]
description = "Serve the Harbor jobs dashboard (harbor/jobs) on http://127.0.0.1:8642/"
raw_args = true
run = "uv run --locked python harbor/harbor_dashboard.py"

[tasks.clean]
description = "Clear generated artifacts, keeping harbor/jobs"
run = """
rm -rf .ruff_cache .venv tests/.venv
find . -type d \\( -name __pycache__ -o -name .pytest_cache \\) -exec rm -rf {} +
"""

[tasks.test]
description = "Run all tests"
depends = ["test:unit", "test:integration"]
